services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ../cloudflared:/etc/cloudflared
    networks:
      - internal
    # Necesario en linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ---

networks:
  internal:
    driver: bridge
